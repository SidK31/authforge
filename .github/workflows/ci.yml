name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh dependency lockfile
        run: npm install --package-lock-only

      - name: Commit lockfile changes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh package lockfile'
          git push

      - name: Install dependencies
        run: npm ci

      - name: Capture dependency audit
        run: npm audit --json > audit.json || true

      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: authforge-dependency-audit
          path: audit.json
          if-no-files-found: error

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Check formatting
        run: npm run format:check

      - name: Check lint
        run: npm run lint:check

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
