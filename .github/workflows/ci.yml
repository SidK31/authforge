name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Check formatting and show diff
        run: |
          npm run format:check || true
          npm run format
          git diff -- src test
          exit 1

      - name: Check lint
        run: npm run lint:check

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
