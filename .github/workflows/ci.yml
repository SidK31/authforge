name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Preview Redis abuse test formatting
        run: |
          npx prettier --write src/auth/auth-abuse.service.spec.ts
          git diff -- src/auth/auth-abuse.service.spec.ts

      - name: Check formatting
        run: npm run format:check

      - name: Check lint
        run: npm run lint:check

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
